schema_version: 1

context:
  name: aws-durable-execution-sdk-python
  version: 2.1.0
  python_min: '3.11'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/aws_durable_execution_sdk_python-${{ version }}.tar.gz
  sha256: 74e56ab587defc7b98b674fe3b5f8c46500b74e3941719caca5b76c57800d844
  target_directory: pkg/src

build:
  number: 0
  noarch: python
  script:
    - cd pkg/src
    - cp LICENSE ../..
    - cp NOTICE ../..
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
    - sed
  run:
    - python >=${{ python_min }}
    - boto3 >=1.43.114
tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - aws_durable_execution_sdk_python
      pip_check: true

about:
  homepage: https://github.com/aws/aws-durable-execution-sdk-python
  repository: https://github.com/aws/aws-durable-execution-sdk-python
  summary: AWS Durable Execution SDK for Python
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE

extra:
  recipe-maintainers:
    - xhochy
