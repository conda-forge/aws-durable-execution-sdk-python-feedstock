schema_version: 1

context:
  name: aws-durable-execution-sdk-python
  version: "2.0.1"
  python_min: "3.11"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/aws_durable_execution_sdk_python-${{ version }}.tar.gz
  sha256: 2ad9b8748d0f33d258b16a76ab6b7469057a0d1fdacfea153c232465c3f032bd
  target_directory: pkg/src

build:
  number: 0
  noarch: python
  script:
    - cd pkg/src
    - cp LICENSE ../..
    - cp NOTICE ../..
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
    - sed
  run:
    - python >=${{ python_min }}
    - boto3 >=1.42.1
tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - aws_durable_execution_sdk_python
      pip_check: true

about:
  homepage: https://github.com/aws/aws-durable-execution-sdk-python
  repository: https://github.com/aws/aws-durable-execution-sdk-python
  summary: AWS Durable Execution SDK for Python
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE

extra:
  recipe-maintainers:
    - xhochy
