schema_version: 1

context:
  name: aws-durable-execution-sdk-python
  version: "3.0.2"
  python_min: '3.11'

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/aws_durable_execution_sdk_python-${{ version }}.tar.gz
  sha256: ffeab0c7668ea606f75cc63c37bd5feb24f6f6d376661c293e8739d228a565a0
  target_directory: pkg/src

build:
  number: 0
  noarch: python
  script:
    - cd pkg/src
    - cp LICENSE ../..
    - cp NOTICE ../..
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - hatchling
    - pip
    - sed
  run:
    - python >=${{ python_min }}
    - boto3 >=1.43.114
tests:
  - python:
      python_version: ${{ python_min }}.*
      imports:
        - aws_durable_execution_sdk_python
      pip_check: true

about:
  homepage: https://github.com/aws/aws-durable-execution-sdk-python
  repository: https://github.com/aws/aws-durable-execution-sdk-python
  summary: AWS Durable Execution SDK for Python
  license: Apache-2.0
  license_file:
    - LICENSE
    - NOTICE

extra:
  recipe-maintainers:
    - xhochy
